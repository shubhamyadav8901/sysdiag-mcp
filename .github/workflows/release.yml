name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    strategy:
      matrix:
        # Both, always. A 32-bit build on 64-bit Windows starts happily and then answers wrongly --
        # handle.exe reports "No matching handles found." for everything -- so shipping only one
        # architecture is how a target ends up quietly broken.
        rid: [win-x64, win-x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and test
        run: |
          dotnet build -warnaserror
          dotnet test tests/WinDiag.Mcp.Tests --no-build
          dotnet test tests/DiagRelay.Mcp.Tests --no-build

      # Self-contained and single-file: a target is a machine with no .NET SDK and often no way to
      # install one. Compression roughly halves the payload for a slow link to a lab VM.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/WinDiag.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/${{ matrix.rid }}

      # The hash is the point. A copy of a build reached a lab VM at exactly the right size and was
      # corrupt, twice; update_self refuses anything whose hash the caller did not state, so the
      # release has to publish the hash the caller is meant to state.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/${{ matrix.rid }}/WinDiag.Mcp.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  WinDiag.Mcp.exe" | Set-Content "artifacts/${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: windiag-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/WinDiag.Mcp.exe
            artifacts/${{ matrix.rid }}/SHA256.txt

  publish-relay:
    # Each built on its own OS. An osx-arm64 executable must carry at least an ad-hoc code signature to
    # run on Apple Silicon, and the SDK can only apply one when it builds on macOS -- cross-published from
    # Windows it is produced unsigned and refuses to start.
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     exe: DiagRelay.Mcp.exe }
          - { os: ubuntu-latest,  rid: linux-x64,   exe: DiagRelay.Mcp }
          - { os: macos-latest,   rid: osx-arm64,   exe: DiagRelay.Mcp }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and test
        run: |
          dotnet build tests/DiagRelay.Mcp.Tests -warnaserror
          dotnet test tests/DiagRelay.Mcp.Tests --no-build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/DiagRelay.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/diagrelay-${{ matrix.rid }}

      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/diagrelay-${{ matrix.rid }}/${{ matrix.exe }}"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  ${{ matrix.exe }}" | Set-Content "artifacts/diagrelay-${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: diagrelay-${{ matrix.rid }}
          path: |
            artifacts/diagrelay-${{ matrix.rid }}/${{ matrix.exe }}
            artifacts/diagrelay-${{ matrix.rid }}/SHA256.txt

  publish-linuxdiag:
    # The Linux server, built and tested on Linux: its [LinuxFact] tests skip anywhere else, so a Windows
    # runner would publish a build nothing had exercised. x86-64 only -- its P/Invoke flag values are.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The kit's tests are built explicitly: LinuxDiag's test project links the kit's guards as source and
      # does not reference the kit's test project, so `--no-build` would find nothing to run.
      - name: Build and test
        run: |
          dotnet build tests/Diag.Mcp.Server.Tests -warnaserror
          dotnet build tests/LinuxDiag.Mcp.Tests -warnaserror
          dotnet test tests/Diag.Mcp.Server.Tests --no-build
          dotnet test tests/LinuxDiag.Mcp.Tests --no-build

      - name: Publish linux-x64
        run: >
          dotnet publish src/LinuxDiag.Mcp
          -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/linuxdiag-linux-x64

      # The hash update_self must be given; see the publish job.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/linuxdiag-linux-x64/LinuxDiag.Mcp"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  LinuxDiag.Mcp" | Set-Content "artifacts/linuxdiag-linux-x64/SHA256.txt"
          Write-Host "linux-x64 $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: linuxdiag-linux-x64
          path: |
            artifacts/linuxdiag-linux-x64/LinuxDiag.Mcp
            artifacts/linuxdiag-linux-x64/SHA256.txt

  publish-macdiag:
    # Built on macOS so the SDK applies the ad-hoc signature an Apple Silicon Mac needs to start the binary
    # at all. osx-x64 has no native runner here; it is published from the same machine, its parsers and
    # registration tested but its [MacFact] tests run only on arm64.
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and test
        run: |
          dotnet build tests/Diag.Mcp.Server.Tests -warnaserror
          dotnet build tests/MacDiag.Mcp.Tests -warnaserror
          dotnet test tests/Diag.Mcp.Server.Tests --no-build
          dotnet test tests/MacDiag.Mcp.Tests --no-build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/MacDiag.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/macdiag-${{ matrix.rid }}

      - name: Verify signature
        run: codesign --verify --verbose artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp

      # The hash update_self must be given; see the publish job.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  MacDiag.Mcp" | Set-Content "artifacts/macdiag-${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: macdiag-${{ matrix.rid }}
          path: |
            artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp
            artifacts/macdiag-${{ matrix.rid }}/SHA256.txt
