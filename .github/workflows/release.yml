name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only for the build jobs, which restore packages and run tests; only the release job may write.
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    strategy:
      matrix:
        # Both, always. A 32-bit build on 64-bit Windows starts happily and then answers wrongly --
        # handle.exe reports "No matching handles found." for everything -- so shipping only one
        # architecture is how a target ends up quietly broken.
        rid: [win-x64, win-x86]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # One dotnet command per step. A multi-line run block on a Windows runner is pwsh, which fails the
      # step on the LAST command's exit code only: a red WinDiag suite followed by a green relay suite
      # published the build anyway.
      - name: Build
        run: dotnet build -warnaserror

      - name: Test WinDiag
        run: dotnet test tests/WinDiag.Mcp.Tests --no-build

      - name: Test the relay
        run: dotnet test tests/DiagRelay.Mcp.Tests --no-build

      # Self-contained and single-file: a target is a machine with no .NET SDK and often no way to
      # install one. Compression roughly halves the payload for a slow link to a lab VM.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/WinDiag.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/${{ matrix.rid }}

      # The hash is the point. A copy of a build reached a lab VM at exactly the right size and was
      # corrupt, twice; update_self refuses anything whose hash the caller did not state, so the
      # release has to publish the hash the caller is meant to state.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/${{ matrix.rid }}/WinDiag.Mcp.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  WinDiag.Mcp.exe" | Set-Content "artifacts/${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v7
        with:
          name: windiag-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/WinDiag.Mcp.exe
            artifacts/${{ matrix.rid }}/SHA256.txt

  publish-relay:
    # Each built on its own OS. An osx-arm64 executable must carry at least an ad-hoc code signature to
    # run on Apple Silicon, and the SDK can only apply one when it builds on macOS -- cross-published from
    # Windows it is produced unsigned and refuses to start.
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     exe: DiagRelay.Mcp.exe }
          - { os: ubuntu-latest,  rid: linux-x64,   exe: DiagRelay.Mcp }
          - { os: macos-latest,   rid: osx-arm64,   exe: DiagRelay.Mcp }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # One dotnet command per step, for the reason the publish job gives: this matrix has a Windows leg.
      - name: Build
        run: dotnet build tests/DiagRelay.Mcp.Tests -warnaserror

      - name: Test
        run: dotnet test tests/DiagRelay.Mcp.Tests --no-build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/DiagRelay.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/diagrelay-${{ matrix.rid }}

      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/diagrelay-${{ matrix.rid }}/${{ matrix.exe }}"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  ${{ matrix.exe }}" | Set-Content "artifacts/diagrelay-${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v7
        with:
          name: diagrelay-${{ matrix.rid }}
          path: |
            artifacts/diagrelay-${{ matrix.rid }}/${{ matrix.exe }}
            artifacts/diagrelay-${{ matrix.rid }}/SHA256.txt

  publish-linuxdiag:
    # The Linux server, built and tested on Linux: its [LinuxFact] tests skip anywhere else, so a Windows
    # runner would publish a build nothing had exercised. x86-64 only -- its P/Invoke flag values are.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # The kit's tests are built explicitly: LinuxDiag's test project links the kit's guards as source and
      # does not reference the kit's test project, so `--no-build` would find nothing to run. One dotnet
      # command per step, so a failure cannot hide behind the default shell's rules; see the publish job.
      - name: Build the server kit
        run: dotnet build tests/Diag.Mcp.Server.Tests -warnaserror

      - name: Build LinuxDiag
        run: dotnet build tests/LinuxDiag.Mcp.Tests -warnaserror

      - name: Test the server kit
        run: dotnet test tests/Diag.Mcp.Server.Tests --no-build

      - name: Test LinuxDiag
        run: dotnet test tests/LinuxDiag.Mcp.Tests --no-build

      - name: Publish linux-x64
        run: >
          dotnet publish src/LinuxDiag.Mcp
          -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/linuxdiag-linux-x64

      # The hash update_self must be given; see the publish job.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/linuxdiag-linux-x64/LinuxDiag.Mcp"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  LinuxDiag.Mcp" | Set-Content "artifacts/linuxdiag-linux-x64/SHA256.txt"
          Write-Host "linux-x64 $sha"

      - uses: actions/upload-artifact@v7
        with:
          name: linuxdiag-linux-x64
          path: |
            artifacts/linuxdiag-linux-x64/LinuxDiag.Mcp
            artifacts/linuxdiag-linux-x64/SHA256.txt

  publish-macdiag:
    # Built on macOS so the SDK applies the ad-hoc signature an Apple Silicon Mac needs to start the binary
    # at all. osx-x64 has no native runner here; it is published from the same machine, its parsers and
    # registration tested but its [MacFact] tests run only on arm64.
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # One dotnet command per step; see the publish job.
      - name: Build the server kit
        run: dotnet build tests/Diag.Mcp.Server.Tests -warnaserror

      - name: Build MacDiag
        run: dotnet build tests/MacDiag.Mcp.Tests -warnaserror

      - name: Test the server kit
        run: dotnet test tests/Diag.Mcp.Server.Tests --no-build

      - name: Test MacDiag
        run: dotnet test tests/MacDiag.Mcp.Tests --no-build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/MacDiag.Mcp
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/macdiag-${{ matrix.rid }}

      - name: Verify signature
        run: codesign --verify --verbose artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp

      # The hash update_self must be given; see the publish job.
      - name: Hash
        shell: pwsh
        run: |
          $exe = "artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  MacDiag.Mcp" | Set-Content "artifacts/macdiag-${{ matrix.rid }}/SHA256.txt"
          Write-Host "${{ matrix.rid }} $sha"

      - uses: actions/upload-artifact@v7
        with:
          name: macdiag-${{ matrix.rid }}
          path: |
            artifacts/macdiag-${{ matrix.rid }}/MacDiag.Mcp
            artifacts/macdiag-${{ matrix.rid }}/SHA256.txt

  github-release:
    # Everything but the last step runs on a manual run too, so the packaging and the notes are rehearsed
    # before a tag is pushed. Only a tag publishes.
    needs: [publish, publish-relay, publish-linuxdiag, publish-macdiag]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      # The version the build carries, and on a tag, proof the tag says the same: a release whose binaries
      # report another version would hand update_self callers the wrong build.
      - name: Version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '\r')
          test -n "$version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match <Version> ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Artifacts lose the executable bit on the way through, and zip keeps whatever mode it finds: without
      # this, every Linux and macOS binary would arrive unable to run.
      - name: Package
        run: |
          cd dist
          find . -type f ! -name '*.txt' ! -name '*.exe' -exec chmod 755 {} +
          for dir in */; do
            name=${dir%/}
            (cd "$name" && zip -q "../${name}-v${{ steps.version.outputs.version }}.zip" *)
          done
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"; exit 1; }
          head -n 5 notes.md

      - name: Publish
        # A pushed tag only: a manual run started on a tag has ref_type tag too, and is still a rehearsal.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt
          --title "sysdiag ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
