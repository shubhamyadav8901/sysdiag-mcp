name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-latest is not a preference: the target framework is net9.0-windows and the code calls
    # Restart Manager, ServiceController, EventLogReader and WinVerifyTrust directly.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      # -warnaserror on purpose: a warning here is usually a nullability or platform-compatibility
      # complaint, and both of those turn into wrong answers on a target rather than a crash.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      # Only the offline suite. tests/WinDiag.Mcp.OnTarget needs a real machine, administrator
      # rights and a kernel driver, so it cannot run here -- see tools/verify-on-target.ps1.
      - name: Test
        run: dotnet test tests/WinDiag.Mcp.Tests --no-build --verbosity normal

      - name: Test the relay
        run: dotnet test tests/DiagRelay.Mcp.Tests --no-build --verbosity normal

      - name: Test the server kit
        run: dotnet test tests/Diag.Mcp.Server.Tests --no-build --verbosity normal

      # The Linux server's parsers and registration run anywhere; its [LinuxFact] tests skip here and
      # run in the relay job's Linux leg.
      - name: Test LinuxDiag (parsers and registration)
        run: dotnet test tests/LinuxDiag.Mcp.Tests --no-build --verbosity normal

      # Guards a failure the unit suite structurally cannot see. EventLog reaches
      # System.Threading.AccessControl only through a named-mutex path the compiler never records, so
      # it is absent from the publish set unless referenced outright -- while the test host, which is
      # not published, always has it. A shipped build therefore threw FileNotFoundException on the
      # first event log write while every test stayed green: a service that served every tool until
      # update_self logged one warning mid-update and died.
      #
      # Asserted against the publish *set* because that is what the single-file bundler embeds, so
      # checking here covers the bundle without unpacking it.
      - name: Publish carries the assemblies reached only by reflection
        shell: pwsh
        run: |
          dotnet publish src/WinDiag.Mcp/WinDiag.Mcp.csproj -c Release -r win-x64 `
            --self-contained -p:PublishSingleFile=false -o artifacts/ci-publish-check
          $required = 'System.Threading.AccessControl.dll', 'System.Diagnostics.EventLog.dll'
          $missing = $required | Where-Object { -not (Test-Path "artifacts/ci-publish-check/$_") }
          if ($missing) {
            throw "Publish output is missing: $($missing -join ', '). Add a PackageReference; a " +
                  "transitive dependency alone does not survive to the published set."
          }
          Write-Host "publish set carries: $($required -join ', ')"

  relay:
    # The relay and its shared core are net9.0 and must stay that way, so they are built and tested on
    # the platforms they exist for. Per project, not per solution: the solution also holds net9.0-windows
    # projects, which fail to restore here with NETSDK1100.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build tests/DiagRelay.Mcp.Tests -warnaserror

      - name: Test
        run: dotnet test tests/DiagRelay.Mcp.Tests --no-build --verbosity normal

      # The shared server kit, including the Unix write-path tests that report Skipped on Windows and
      # the relay<->kit contract test, which runs the relay's real transfer code against the kit.
      - name: Build the server kit
        run: dotnet build tests/Diag.Mcp.Server.Tests -warnaserror

      - name: Test the server kit
        run: dotnet test tests/Diag.Mcp.Server.Tests --no-build --verbosity normal

      - name: Build LinuxDiag
        run: dotnet build tests/LinuxDiag.Mcp.Tests -warnaserror

      - name: Test LinuxDiag
        run: dotnet test tests/LinuxDiag.Mcp.Tests --no-build --verbosity normal

      # The kit carries a web server; the relay is a stdio client and must not. Checked on the publish
      # set because a transitive reference would not show in the project file.
      - name: The relay does not ship a web server
        shell: pwsh
        run: |
          $rid = if ($IsMacOS) { 'osx-arm64' } else { 'linux-x64' }
          dotnet publish src/DiagRelay.Mcp -c Release -r $rid --self-contained -p:PublishSingleFile=false `
            -o artifacts/relay-k1
          $web = Get-ChildItem artifacts/relay-k1 -Filter 'Microsoft.AspNetCore*'
          if ($web) { throw "The relay's publish set contains ASP.NET Core: $($web.Name -join ', ')" }
          Write-Host "relay publish set: no ASP.NET Core"
